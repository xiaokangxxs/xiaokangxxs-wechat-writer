name: Validate Skill
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  skill-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        run: python -m compileall -q scripts tests
      - name: Verify public README images, links and sources
        run: python scripts/validate_public_repo.py
      - name: Verify complete Skill package and brand checksums
        run: python scripts/validate_skill.py .
      - name: Run regression suite (26 tests)
        run: python tests/run_tests.py
